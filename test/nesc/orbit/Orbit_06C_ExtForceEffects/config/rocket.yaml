# case 6C: cylinder with 29,000 N for 93 s from t = 1,000 s out of the orbit plane. the engine is gimbaled 90 deg
# (config/fc_schedule.txt) to push along -y body from the CoM.
# NESC gives the state in J2000, rotated here into the sim's ECI by the earth rotation angle at
# 2007-11-20T00:00:00 (58.531202 deg), the same rotation the sim applies to the sun and moon

rockets:
  - name: orbit_06c
    track_data: true
    export_interval: 60.0

    start_in_eci: true
    eci_position_m: [-1426225.051089, 4159940.168814, 5139356.570000]
    eci_velocity_m_s: [-6363.342072, -4023.253265, 1484.521489]
    # NESC's J2000 attitude rotated by the epoch's earth rotation angle, body to ECI [w, x, y, z]. the sim's nose (+z) is NESC's x
    initial_attitude_q: [0.124058856753152, -0.475325267445318, -0.42083867218498, 0.762607436485327]
    initial_body_rates_rad_s: [-0.0011344542745508, 0.0, 0.0] # NESC's (q, r, p)

    nosecone_length: 0.0
    nosecone_mass: 0.0
    inertia_kg_m2: [12250.0, 12250.0, 500.0, 0.0, 0.0, 0.0] # NESC's cylinder, its x axis is the sim's z (nose)

    # 12 m x 1 m, 1,000 kg uniform cylinder. a token amount of fuel lets the engine apply NESC's force
    # without the mass changing
    stage:
      - id: 1
        geometry:
          shape: cylinder
          radius: 0.5
        dry_mass: 1000.0
        fuel_mass: 0.001
        length: 12.0
        com_distance: 6.0
        engine_distance: 6.0 # at the CoM so the side thrust adds no torque
        gimbal_range_deg: 90.0
        thrust_curve: thrust.csv
