# case 4: sphere with CD 0.1 dropped from 30,000 ft at rest over a round non-rotating earth with inverse square gravity
# (sim.yaml sets the earth), spinning 10/20/30 deg/s
# ECI is ECEF, so lat 0 lon 0 lies on +x, 30,000 ft above NESC's 6,371,007.1809 m round earth

rockets:
  - name: atmos_04
    track_data: true
    export_interval: 0.1

    start_in_eci: true
    eci_position_m: [6380151.180900, 0.000000, 0.000000]
    eci_velocity_m_s: [0.000000, 0.000000, 0.000000]
    # NESC's local NED attitude, body to ECI [w, x, y, z]. the sim's nose (+z) is NESC's x
    initial_attitude_q: [0.707106781186548, 0.0, 0.0, 0.707106781186548]
    initial_body_rates_rad_s: [0.349065850398615, 0.523598775598299, 0.174532925199308] # NESC's (q, r, p)

    nosecone_length: 0.0
    nosecone_mass: 0.0
    inertia_kg_m2: [4.880945, 4.880945, 4.880945, 0.0, 0.0, 0.0] # NESC's 3.6 slug ft^2

    # 1 slug, 6 in diameter cannonball
    stage:
      - id: 1
        geometry:
          shape: sphere
          radius: 0.0762
          cd: 0.1
        dry_mass: 14.5939
        fuel_mass: 0.0
        com_distance: 0.0762
        thrust_curve: ../../../zero_thrust.csv
