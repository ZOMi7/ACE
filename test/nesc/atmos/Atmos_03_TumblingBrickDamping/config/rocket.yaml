# case 3: brick dropped from 30,000 ft with rotational damping but no drag. APPROXIMATE: the sim's
# drag toggle also removes its damping, so this flies like case 2
# ECI is ECEF at t = 0, so lat 0 lon 0 lies on +x and the inertial velocity is the
# earth relative velocity plus the earth's spin (w x r, w = 7.292115e-5 rad/s)

rockets:
  - name: atmos_03
    track_data: true
    export_interval: 0.1

    start_in_eci: true
    eci_position_m: [6387281.000000, 0.000000, 0.000000]
    eci_velocity_m_s: [0.000000, 465.767876, 0.000000]
    # NESC's local NED attitude, body to ECI [w, x, y, z]. the sim's nose (+z) is NESC's x
    initial_attitude_q: [0.707106781186548, 0.0, 0.0, 0.707106781186548]
    initial_body_rates_rad_s: [0.349065850398498, 0.523598775598299, 0.174532925199433] # NESC's (q, r, p)

    nosecone_length: 0.0
    nosecone_mass: 0.0
    # NESC's brick inertia. its x (long) axis is the sim's z (nose), y is the sim's x, z is the sim's y
    inertia_kg_m2: [0.008421011, 0.009754656, 0.002568217, 0.0, 0.0, 0.0]

    # 8 x 4 x 2.25 in brick, the cylinder only sets its size
    stage:
      - id: 1
        geometry:
          shape: cylinder
          radius: 0.0476
        dry_mass: 2.26796
        fuel_mass: 0.0
        length: 0.2032
        com_distance: 0.1016
        thrust_curve: ../../../zero_thrust.csv
