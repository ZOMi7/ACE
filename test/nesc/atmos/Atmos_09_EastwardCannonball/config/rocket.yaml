# case 9: sphere with CD 0.1 fired from sea level at 1,000 ft/s east and 1,000 ft/s up
# ECI is ECEF at t = 0, so lat 0 lon 0 lies on +x and the inertial velocity is the
# earth relative velocity plus the earth's spin (w x r, w = 7.292115e-5 rad/s)

rockets:
  - name: atmos_09
    track_data: true
    export_interval: 0.1

    start_in_eci: true
    eci_position_m: [6378137.000000, 0.000000, 0.000000]
    eci_velocity_m_s: [304.800000, 769.901085, 0.000000]
    # NESC's local NED attitude, body to ECI [w, x, y, z]. the sim's nose (+z) is NESC's x
    initial_attitude_q: [0.5, -0.5, 0.5, 0.5]
    initial_body_rates_rad_s: [-7.29211476918952e-05, 0.0, 0.0] # NESC's (q, r, p)

    nosecone_length: 0.0
    nosecone_mass: 0.0
    inertia_kg_m2: [4.880945, 4.880945, 4.880945, 0.0, 0.0, 0.0] # NESC's 3.6 slug ft^2

    # 1 slug, 6 in diameter cannonball
    stage:
      - id: 1
        geometry:
          shape: sphere
          radius: 0.0762
          cd: 0.1
        dry_mass: 14.5939
        fuel_mass: 0.0
        com_distance: 0.0762
        thrust_curve: ../../../zero_thrust.csv
